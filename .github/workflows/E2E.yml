name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: teste
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '25'
        cache: maven

    - uses: actions/setup-node@v6
      with:
        node-version: lts/*

    - name: Start API
      working-directory: api
      env:
        SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/teste
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: root
      run: |
        chmod +x mvnw
        nohup ./mvnw -B spring-boot:run > ../api.log 2>&1 &

    - name: Build and start client
      working-directory: client
      env:
        NEXT_PUBLIC_BASE_URL: http://localhost:8080
      run: |
        npm ci
        npm run build
        nohup npm start > ../client.log 2>&1 &

    - name: Wait for API and client
      run: |
        timeout 300 bash -c 'until curl -s http://localhost:8080 > /dev/null; do sleep 3; done'
        timeout 120 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 3; done'

    - name: Install test dependencies
      working-directory: tests
      run: npm ci

    - name: Install Playwright Browsers
      working-directory: tests
      run: npx playwright install --with-deps chromium msedge

    - name: Run Playwright tests
      working-directory: tests
      run: npx playwright test

    - name: Show server logs
      if: ${{ failure() }}
      run: |
        echo "===== API ====="; cat api.log || true
        echo "===== CLIENT ====="; cat client.log || true

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: tests/playwright-report/
        retention-days: 30
